<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clic&amp;Progress, intro animée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   INTRO CLIC&PROGRESS : tout ce qui commence par .cp-intro
   est à copier dans le site. Le reste (.demo) sert à l'aperçu.
   ========================================================= */
.cp-intro{
  --cp-orange:#ED6D1A;
  --cp-ink:#111;
  position:fixed; inset:0; z-index:9999;
  background:#fff;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  font-family:'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
  cursor:pointer;
}
.cp-intro[hidden]{display:none}
.cp-stage{display:flex; flex-direction:column; align-items:center; gap:clamp(14px,2.2vw,26px); padding:0 6vw}
.cp-lockup{
  --h:clamp(84px,14vw,190px);
  display:flex; align-items:center; gap:calc(var(--h)*.06);
}
.cp-icon{width:var(--h); height:var(--h); position:relative; flex:none; opacity:0}
.cp-icon img{width:100%; height:100%; display:block}
.cp-word{
  position:relative; height:calc(var(--h)*.323); aspect-ratio:1204/190;
  margin-top:calc(var(--h)*.03);
}
.cp-letter{position:absolute; top:0; height:100%; overflow:hidden}
.cp-letter span{
  position:absolute; top:0; height:100%;
  background:var(--cp-word) no-repeat 0 0 / 100% 100%;
  transform:translateY(105%);
}
.cp-tagline{
  margin:0; font-weight:500; color:#444; letter-spacing:.01em;
  font-size:clamp(14px,2vw,20px); opacity:0; text-align:center;
}
.cp-cursor{
  position:absolute; width:28px; height:28px; left:0; top:0;
  pointer-events:none; opacity:0; z-index:3;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));
}
.cp-ripple{
  position:absolute; left:50%; top:50%; width:100%; height:100%;
  border:3px solid var(--cp-orange); border-radius:50%;
  transform:translate(-50%,-50%) scale(.2); opacity:0; pointer-events:none;
}
.cp-cover{
  position:absolute; width:40px; height:40px; border-radius:50%;
  background:var(--cp-orange); transform:scale(0); pointer-events:none; z-index:4;
}
.cp-skip{
  position:absolute; right:clamp(16px,3vw,32px); bottom:calc(clamp(16px,3vw,32px) + env(safe-area-inset-bottom,0px));
  z-index:5; font:inherit; font-size:14px; font-weight:500; color:#555;
  background:none; border:1px solid #ccc; border-radius:999px; padding:8px 16px; cursor:pointer;
}
.cp-skip:hover{border-color:var(--cp-orange); color:var(--cp-orange)}
.cp-skip:focus-visible{outline:3px solid var(--cp-orange); outline-offset:3px}

/* ----- Aperçu uniquement : faux site derrière l'intro ----- */
body{margin:0; font-family:'Poppins',system-ui,sans-serif}
.demo{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; background:#fafafa; color:#222; text-align:center; padding:24px}
.demo h1{margin:0; font-size:clamp(24px,4vw,40px)}
.demo p{margin:0; color:#666; max-width:44ch}
.demo button{font:inherit; font-weight:700; background:#ED6D1A; color:#fff; border:0; border-radius:999px; padding:12px 26px; cursor:pointer}
</style>
</head>
<body>

<!-- ===== Faux site (aperçu uniquement) ===== -->
<main class="demo">
  <h1>Ici commence ton site</h1>
  <p>L'intro s'est effacée pour laisser place à la page d'accueil.</p>
  <button type="button" onclick="cpIntro.play(true)">Revoir l'animation</button>
</main>

  // découpe des lettres dans l'image du mot (en px, image de 1204 px de large)
  const CUTS = [0,124,171,219,322,461,563,632,738,851,923,1026,1118,1204];

  const el = document.getElementById('cpIntro');
  const icon = document.getElementById('cpIcon');
  const word = document.getElementById('cpWord');
  const tag = document.getElementById('cpTag');
  const cursor = document.getElementById('cpCursor');
  const cover = document.getElementById('cpCover');
  const skipBtn = document.getElementById('cpSkip');
  const ripples = icon.querySelectorAll('.cp-ripple');
  const W = 1204;
  word.style.setProperty('--cp-word', `url(${WORD_SRC})`);

  const letters = [];
  for (let i = 0; i < CUTS.length - 1; i++) {
    const l = CUTS[i], w = CUTS[i+1] - l;
    const box = document.createElement('div');
    box.className = 'cp-letter';
    box.style.left = (l / W * 100) + '%';
    box.style.width = (w / W * 100) + '%';
    const s = document.createElement('span');
    s.style.width = (W / w * 100) + '%';
    s.style.left = (-l / w * 100) + '%';
    box.appendChild(s);
    word.appendChild(box);
    letters.push(s);
  }

  let running = [], done = false;
  const anim = (node, kf, opt) => { const a = node.animate(kf, { fill: 'forwards', ...opt }); running.push(a); return a.finished; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const ease = { out: 'cubic-bezier(.22,1,.36,1)', back: 'cubic-bezier(.34,1.56,.64,1)', io: 'cubic-bezier(.65,0,.35,1)' };

  function finish() {
    if (done) return; done = true;
    running.forEach(a => a.cancel());
    el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 350, fill: 'forwards' })
      .finished.then(() => { el.hidden = true; document.documentElement.style.overflow = ''; });
  }

  async function sequence() {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) {
      icon.style.opacity = 1; letters.forEach(s => s.style.transform = 'none'); tag.style.opacity = 1;
      await wait(1400); if (!done) finish(); return;
    }

    // 1. le logo final est centré : on calcule le décalage pour démarrer l'icône au centre de l'écran
    const r = icon.getBoundingClientRect(), vr = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const dx = vr.width / 2 - cx, dy = vr.height / 2 - cy;

    // 2. le curseur arrive et vise le centre
    const start = { x: vr.width * .78, y: vr.height * .85 };
    const tx = vr.width / 2 - 4, ty = vr.height / 2 - 2;
    anim(cursor, [
      { opacity: 0, transform: `translate(${start.x}px,${start.y}px)` },
      { opacity: 1, offset: .2 },
      { opacity: 1, transform: `translate(${tx}px,${ty}px)` }
    ], { duration: 750, easing: ease.out });
    await wait(820); if (done) return;

    // 3. le « clic » : curseur qui presse, logo qui éclot, ondes orange
    anim(cursor, [{ transform: `translate(${tx}px,${ty}px) scale(1)` }, { transform: `translate(${tx}px,${ty}px) scale(.78)` }, { transform: `translate(${tx}px,${ty}px) scale(1)` }], { duration: 220 });
    await wait(110); if (done) return;
    anim(icon, [
      { opacity: 1, transform: `translate(${dx}px,${dy}px) scale(0) rotate(-120deg)` },
      { opacity: 1, transform: `translate(${dx}px,${dy}px) scale(1) rotate(0deg)` }
    ], { duration: 650, easing: ease.back });
    ripples.forEach((rp, i) => anim(rp, [
      { opacity: .9, transform: 'translate(-50%,-50%) scale(.6)' },
      { opacity: 0, transform: 'translate(-50%,-50%) scale(1.9)' }
    ], { duration: 900, delay: 120 + i * 180, easing: ease.out }));
    anim(cursor, [{ opacity: 1, transform: `translate(${tx}px,${ty}px)` }, { opacity: 0, transform: `translate(${tx + 40}px,${ty + 60}px)` }], { duration: 400, delay: 250, easing: ease.io });
    await wait(700); if (done) return;

    // 4. l'icône glisse à sa place, les lettres montent une à une
    anim(icon, [
      { opacity: 1, transform: `translate(${dx}px,${dy}px)` },
      { opacity: 1, transform: 'translate(0,0)' }
    ], { duration: 700, easing: ease.io });
    letters.forEach((s, i) => anim(s, [
      { transform: 'translateY(105%)' }, { transform: 'translateY(0)' }
    ], { duration: 520, delay: 250 + i * 45, easing: ease.out }));
    await wait(1150); if (done) return;

    // 5. la phrase d'accroche
    anim(tag, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 500, easing: ease.out });
    await wait(1300); if (done) return;

    // 6. sortie : un disque orange part de l'icône et recouvre l'écran, puis tout s'efface
    const r2 = icon.getBoundingClientRect();
    const ox = r2.left + r2.width / 2, oy = r2.top + r2.height / 2;
    cover.style.left = (ox - 20) + 'px'; cover.style.top = (oy - 20) + 'px';
    const far = Math.hypot(Math.max(ox, vr.width - ox), Math.max(oy, vr.height - oy));
    skipBtn.style.visibility = 'hidden';
    await anim(cover, [{ transform: 'scale(0)' }, { transform: `scale(${far / 20 + 1})` }], { duration: 650, easing: 'cubic-bezier(.7,0,.3,1)' });
    if (!done) finish();
  }

  function play(force) {
    try {
      if (!force && SHOW_ONCE_PER_SESSION && sessionStorage.getItem('cpIntroSeen')) { el.hidden = true; return; }
      sessionStorage.setItem('cpIntroSeen', '1');
    } catch (e) {}
    running.forEach(a => a.cancel()); running = []; done = false;
    el.getAnimations().forEach(a => a.cancel());
    icon.style.opacity = ''; tag.style.opacity = ''; letters.forEach(s => s.style.transform = '');
    skipBtn.style.visibility = '';
    el.hidden = false; document.documentElement.style.overflow = 'hidden';
    requestAnimationFrame(() => sequence());
  }

  skipBtn.addEventListener('click', e => { e.stopPropagation(); finish(); });
  el.addEventListener('click', finish);
  document.addEventListener('keydown', e => { if (!el.hidden && e.key === 'Escape') finish(); });

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => play()); else play();
  return { play };
})();
